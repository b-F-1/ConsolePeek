name: ConsolePeek
version: 1.0.0
main: com.example.consolepeek.ConsolePeekPlugin
# If your server rejects this value, delete this line — the plugin uses
# nothing version-specific.
api-version: '1.21'
description: Prints the last X lines of the server console into chat.
author: you

commands:
  console:
    description: Show the last X lines of the server console.
    usage: /console <lines>
  consolepeek:
    description: ConsolePeek admin commands.
    usage: /consolepeek reload | /consolepeek login <lines>
    permission: consolepeek.admin

permissions:
  consolepeek.use:
    description: Allows use of /console.
    # 'op' means operators have it by default. When ops-only is false in
    # config.yml the permission check is skipped entirely.
    default: op
  consolepeek.admin:
    description: Allows reloading the ConsolePeek config.
    default: op
