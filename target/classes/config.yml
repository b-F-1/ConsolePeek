# ConsolePeek configuration
# After editing, run /consolepeek reload (or restart the server) to apply.

# true  = only operators (and anyone with consolepeek.use) can run /console
# false = everyone can run it
#
# Heads up: the console logs player IP addresses, stack traces, and admin
# actions. Setting this to false lets any player read all of that.
ops-only: true

# Hard cap on how many lines /console prints and how many logins
# /consolepeek login will return in one call.
max-lines: 100

# ----- /consolepeek login settings -----

# The marker that identifies a successful-login line. The player name is read
# from just before the [/ip:port] token on that line, and the time from the
# line's [HH:mm:ss] stamp. Matched case-insensitively. The default is the
# vanilla/Paper "logged in with entity id" line, which is emitted once per
# successful join and is the only line that reliably carries both name and time.
login-match: "logged in with entity id"

# How many log files the login search may read through, newest first
# (latest.log first, then dated .log.gz archives). Raise it to reach further
# back into history; lower it to bound disk work. The search also stops early
# as soon as it has collected enough logins to satisfy your requested count.
login-max-files: 60
